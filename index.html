<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富山学生おトク活動</title>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; line-height: 1.6; margin: 0; padding: 0; background-color: #f0f2f5; }
        header { background-color: #003366; color: white; padding: 2rem; text-align: center; }
        .container { width: 90%; max-width: 800px; margin: 20px auto; }
        .shop-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #003366; border-bottom: 2px solid #e0e0e0; padding-bottom: 5px; }
        .tag { background: #ff5722; color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .info { color: #555; font-size: 0.95rem; }
    </style>
</head>
<body>

<header>
    <h1>富山学生おトク活動</h1>
    <p>富山市周辺の学割・バイト情報を大学生が発信！</p>
</header>

<div class="container">
    <!-- ここからお店の情報。増やしたいときはこの .shop-card の塊をコピー -->
    <div class="shop-card">
        <span class="tag">学割</span>
        <h2>〇〇食堂（五福エリア）</h2>
        <p class="info">学生証提示でから揚げ1個サービス！富大生に人気です。</p>
    </div>

    <div class="shop-card">
        <span class="tag">バイト</span>
        <h2>△△カフェ（環水公園前）</h2>
        <p class="info">時給1,100円〜。オシャレな空間で働けます。学生多数在籍。</p>
    </div>
</div>

</body>
</html>
